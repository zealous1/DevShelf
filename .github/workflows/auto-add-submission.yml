name: Auto Process Community Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-submission:
    name: Validate Submission & Open PR
    if: >
      contains(github.event.issue.labels.*.name, 'submission') ||
      startsWith(github.event.issue.title, '[Submit') ||
      startsWith(github.event.issue.title, '[Resource Submission]') ||
      startsWith(github.event.issue.title, '[Tool Submission]') ||
      startsWith(github.event.issue.title, '[API Submission]') ||
      contains(github.event.issue.title, 'Submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process Issue Form Data
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          npx tsx scripts/process-submission.ts

      - name: Rebuild Catalog Documentation & Web Data
        run: |
          pnpm run build
          pnpm run format

      - name: Create Submission Branch & Open Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
          USER_ID: ${{ github.event.issue.user.id }}
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          git add shelf/ README.md docs/ site/ data/ package.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes produced from submission."
          else
            BRANCH_NAME="submission/issue-${ISSUE_NUM}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "feat(community): add submission from issue #${ISSUE_NUM}

          Co-authored-by: ${USER_LOGIN} <${USER_ID}+${USER_LOGIN}@users.noreply.github.com>"
            git push origin "$BRANCH_NAME" --force
            
            PR_URL=$(gh pr create \
              --title "feat(community): add submission from #${ISSUE_NUM}" \
              --body "Resolves #${ISSUE_NUM}

          Submitted by @${USER_LOGIN} via Issue form.
          
          - **Automated PR**: Created by DevShelf Bot with contributor credited as co-author.
          - **Verification**: Full CI suite, schema validator, and URL audit will run on this PR automatically." \
              --head "$BRANCH_NAME" \
              --base "main" \
              --label "submission")
            
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          fi

      - name: Post Confirmation Comment on Issue
        if: steps.create-pr.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const postSubmissionComment = require('./scripts/post-submission-comment.cjs');
            await postSubmissionComment({
              github,
              context,
              prUrl: '${{ steps.create-pr.outputs.pr_url }}',
              prNumber: '${{ steps.create-pr.outputs.pr_number }}'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['has-pr']
            });
