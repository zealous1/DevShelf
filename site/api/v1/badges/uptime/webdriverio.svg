<svg xmlns="http://www.w3.org/2000/svg" width="222" height="24" viewBox="0 0 222 24" role="img" aria-label="WebdriverIO: 99.9% Uptime | CI Verified">
  <defs>
    <clipPath id="uptime-clip">
      <rect width="222" height="24" rx="5" fill="#fff"/>
    </clipPath>
    <linearGradient id="uptime-grad" x1="0" y1="0" x2="222" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#uptime-clip)">
    <rect width="76" height="24" fill="#0f172a"/>
    <rect x="76" width="146" height="24" fill="url(#uptime-grad)"/>
    <rect width="222" height="24" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700">
    <text x="38" y="16" fill="#e2e8f0">📚 DevShelf</text>
    <text x="149" y="16" fill="#ffffff">🟢 99.9% Uptime | CI Verified</text>
  </g>
</svg>